[tool.poetry]
name = "mcp-odoo"
version = "0.1.0"
description = "Multi-Connector Platform for Odoo 14-19 (XML-RPC & JSON-2)"
authors = ["MCP Team <dev@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "mcp_odoo", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.27.0"
requests = "^2.32.0"
pydantic-settings = "^2.3.4"
pydantic = "^2.7.4"
typer = "^0.12.3"
structlog = "^24.1.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"
pytest-cov = "^5.0.0"
respx = "^0.21.1"
requests-mock = "^1.12.1"
pytest-benchmark = "^4.0.0"
ruff = "^0.6.8"

[tool.poetry.scripts]
mcp-odoo = "mcp_odoo.interfaces.cli:app"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E203"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
